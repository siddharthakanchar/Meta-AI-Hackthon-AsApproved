[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asapproved"
version = "0.1.0"
description = "Measures, frame by frame, whether the APR and risk warnings in a regulated firm's approved ad survive Meta's AI edits."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Siddhartha Kancharla" }]
keywords = ["compliance", "fca", "meta-ads", "advantage-plus", "sam", "financial-promotions"]

dependencies = [
  # CLI + config
  "typer>=0.12",
  "rich>=13.7",
  "python-dotenv>=1.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  # vision / video
  "numpy>=1.26,<2.2",
  "opencv-python>=4.10",
  "scikit-image>=0.24",
  "pillow>=10.3",
  # models + APIs
  "openai>=1.40",       # Muse Spark is OpenAI-compatible
  "requests>=2.32",
  "httpx>=0.27",
  # crypto: Ed25519 manifests, SHA-256 hash chain
  "cryptography>=42.0",
  # UI
  "streamlit>=1.37",
  "pandas>=2.2",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3"]
graph = ["neo4j>=5.22"]
pdf = ["reportlab>=4.2"]
viz = ["streamlit-image-comparison>=0.0.4", "pyvis>=0.3.2"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "pre-commit>=3.7"]
all = [
  "asapproved[ocr,graph,pdf,viz,dev]",
]

[project.scripts]
asapproved = "asapproved.cli:app"

[project.urls]
Repository = "https://github.com/siddharthakvss/asapproved"

[tool.hatch.build.targets.wheel]
packages = ["asapproved"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["data", "scratch", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET"]
ignore = [
  "E501",   # line length handled by formatter
  "B008",   # typer uses function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "live: hits a real Meta API; skipped unless ASAPPROVED_MODE=live",
  "slow: takes more than a few seconds",
]
