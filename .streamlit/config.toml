# Streamlit Community Cloud picks this up automatically.
[theme]
base = "dark"
primaryColor = "#e5484d"          # one accent colour, reserved for failures
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#1a1d26"
textColor = "#e8eaed"
font = "sans serif"

[server]
headless = true
# enableCORS is left at its default: setting it false alongside XSRF protection
# makes Streamlit print a twelve-line security warning before the app starts,
# which is the first thing anyone running this sees in their terminal.

[browser]
gatherUsageStats = false
